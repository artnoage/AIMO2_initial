# Default model to use in chat
model = "gpt-4-1106-preview"

# Editor mode - allows editing without /edit command
edit_format = "simple"

# Use line numbers in edit blocks
use_line_numbers = false 

# Show diffs after applying edits
show_diffs = true

# Automatically track files mentioned in chat
auto_track_files = true

# Maximum length of chat history to include in prompts
max_context_tokens = 16000

# Customize the chat display
pretty = true
dark_mode = true

# Git integration settings
git_auto_commit = false
git_auto_commit_message = "AI: {msg}"

# Ignore patterns
ignore_patterns = [
    "*/__pycache__/*",
    "*.pyc",
    "cache/*",
    "results/*",
    "logs/*",
    "models/*",
    "loras/*",
    "local_datasets/*",
    "augmented_datasets/*"
]
